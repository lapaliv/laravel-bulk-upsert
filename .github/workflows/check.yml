name: PHPUnit & Psalm

on: [ pull_request, workflow_dispatch ]

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        laravel: [ '11', '12', '13' ]
        include:
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Allow Composer to install advisory-flagged packages
        run: composer config --global policy.advisories.block false || true

      # The lock file pins one Laravel version, so every combination is resolved anew
      # (in this checkout only): Laravel of the matrix and the Testbench made for it.
      - name: Install Laravel ${{ matrix.laravel }}
        id: install
        run: |
          composer require --no-update --no-interaction "illuminate/database:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs

      - name: Check the installed versions
        run: |
          php -v | head -n 1
          # shellcheck disable=SC2016 # the PHP code is single-quoted on purpose
          php -r '
            require "vendor/autoload.php";
            foreach (["laravel/framework", "orchestra/testbench", "phpunit/phpunit", "nesbot/carbon"] as $package) {
                echo $package, " ", \Composer\InstalledVersions::getPrettyVersion($package), PHP_EOL;
            }
            $version = (string) \Composer\InstalledVersions::getVersion("laravel/framework");
            if ((int) explode(".", ltrim($version, "v"))[0] !== ${{ matrix.laravel }}) {
                fwrite(STDERR, "Laravel {$version} is installed, ${{ matrix.laravel }}.x is expected" . PHP_EOL);
                exit(1);
            }
          '

      - name: Wait for MySQL and PostgreSQL
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            sleep 2
          done
          until pg_isready -h 127.0.0.1 -p 5432; do
            sleep 2
          done

      # Binary logging is on in the MySQL image, so a user without SUPER may not create
      # triggers, which some tests need. The trust is set on this throwaway CI server only;
      # the tests still run as the ordinary test user.
      - name: Allow the test user to create MySQL triggers
        run: |
          docker exec -e MYSQL_PWD=root "${{ job.services.mysql.id }}" \
            mysql -uroot -e "SET GLOBAL log_bin_trust_function_creators = ON"
          value="$(docker exec -e MYSQL_PWD=root "${{ job.services.mysql.id }}" \
            mysql -uroot -N -e "SELECT @@GLOBAL.log_bin_trust_function_creators")"
          test "$value" = "1"

      - name: Create .env file for testing
        run: |
          {
            echo "POSTGRESQL_HOST=127.0.0.1"
            echo "POSTGRESQL_DATABASE=test_db"
            echo "POSTGRESQL_USERNAME=test_user"
            echo "POSTGRESQL_PASSWORD=test_password"
            echo "POSTGRESQL_PORT=5432"
            echo "MYSQL_HOST=127.0.0.1"
            echo "MYSQL_DATABASE=test_db"
            echo "MYSQL_USERNAME=test_user"
            echo "MYSQL_PASSWORD=test_password"
            echo "MYSQL_PORT=3306"
          } > .env

      - name: Run tests (MySQL)
        run: env DB_CONNECTION=mysql ./vendor/bin/phpunit

      - name: Run tests (PostgreSQL)
        # Runs after a failed run of another database too, but not after a failed install.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: env DB_CONNECTION=pgsql ./vendor/bin/phpunit

      - name: Run tests (SQLite)
        # Runs after a failed run of another database too, but not after a failed install.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: env DB_CONNECTION=sqlite ./vendor/bin/phpunit

  psalm:
    runs-on: ubuntu-latest
    env:
      php_version: '8.4'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}
          ini-values: "memory_limit=-1"
          coverage: none

      - name: Allow Composer to install advisory-flagged packages
        run: composer config --global policy.advisories.block false || true

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer check-platform-reqs

      - name: Psalm
        run: ./vendor/bin/psalm --output-format=github --no-progress
